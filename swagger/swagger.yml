basePath: /v1
paths:
  /sabatico/:
    post:
      tags:
      - sabatico
      description: Crea un sabático consumiendo el CRUD
      operationId: SabaticoController.PostCrearSabatico
      parameters:
      - in: body
        name: body
        description: Body para crear sabático
        required: true
        schema:
          $ref: '#/definitions/models.CrearSabaticoRequest'
      responses:
        "201":
          description: ""
          schema:
            $ref: '#/definitions/models.CrearSabaticoResponse'
        "400":
          description: '{object} models.CrearSabaticoResponse'
        "500":
          description: '{object} models.CrearSabaticoResponse'
  /sabatico/plan_trabajo:
    post:
      tags:
      - sabatico
      description: Actualiza el plan de trabajo sabático desactivando el historial actual y creando un nuevo registro con la información actualizada
      operationId: SabaticoController.PostGuardarPlanTrabajoSabatico
      parameters:
      - in: body
        name: body
        description: Body para actualizar el plan de trabajo sabático (descripcion e historial_estado_sabatico_id)
        required: true
        schema:
          $ref: '#/definitions/models.PlanTrabajoSabaticoRequest'
      responses:
        "201":
          description: ""
          schema:
            $ref: '#/definitions/models.HistorialEstadoSabatico'
        "400":
          description: '{object} map[string]interface{}'
        "500":
          description: '{object} map[string]interface{}'
  /sabatico/plan_trabajo/estado:
    post:
      tags:
      - sabatico
      description: Cambia el estado del plan de trabajo sabático y actualiza el estado del soporte asociado
      operationId: SabaticoController.CambiarEstadoPlanTrabajoSabatico
      parameters:
      - in: body
        name: body
        description: Body para cambiar el estado del plan de trabajo sabático
        required: true
        schema:
          $ref: '#/definitions/models.AprobarRechazarPlanTRabajoSabaticoequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/map[string]interface{}'
        "400":
          description: '{object} map[string]interface{}'
        "500":
          description: '{object} map[string]interface{}'
  /sabatico/sabaticos_secretaria/{documentoSecretaria}:
    get:
      tags:
      - sabatico
      description: get SoporteSabatico records by documentoSecretaria
      operationId: SabaticoController.GetByDocumentoSecretaria
  /solicitud/:
    post:
      tags:
      - solicitud
      description: create Solicitud
      operationId: SolicitudController.Create
      parameters:
      - in: body
        name: body
        description: body for Solicitud content
        required: true
        schema:
          $ref: '#/definitions/models.Solicitud'
      responses:
        "201":
          description: ""
          schema:
            $ref: '#/definitions/models.Solicitud'
        "403":
          description: body is empty
  /solicitud/aprobar-rechazar:
    post:
      tags:
      - solicitud
      description: Aprueba o rechaza una solicitud creando un registro en el historial
      operationId: SolicitudController.Aprobar_Rechazar
      parameters:
      - in: body
        name: body
        description: body para aprobar o rechazar solicitud
        required: true
        schema:
          $ref: '#/definitions/interface{}'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/interface{}'
        "400":
          description: the request contains incorrect syntax
  /solicitud/formularios/{documentoId}:
    get:
      tags:
      - solicitud
      description: Obtener formularios por documentoId
      operationId: SolicitudController.GetFormulariosByDocumentoId
      parameters:
      - in: path
        name: documentoId
        description: Identificador del usuario en front
        required: true
        type: string
      - in: query
        name: estadoSolicitud
        description: Estados de la solicitud (repetible)
        type: array
        items:
          type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/interface{}'
        "400":
          description: bad request
  /solicitud/radicar/{id}:
    post:
      tags:
      - solicitud
      description: Radicar una solicitud (cambiar estado y crear registros)
      operationId: SolicitudController.Radicar
      parameters:
      - in: path
        name: id
        description: The id of the Solicitud to radicar
        required: true
        type: integer
        format: int64
      - in: body
        name: body
        description: body for additional data if needed
        schema:
          $ref: '#/definitions/models.SolicitudRequest'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/models.SolicitudResponse'
        "400":
          description: Bad request
        "404":
          description: Solicitud not found
  /soporte_sabatico/:
    post:
      tags:
      - soporte_sabatico
      description: create SoporteSabatico con múltiples documentos
      operationId: SoporteSabaticoController.Create
  /soporte_sabatico/{sabaticoId}:
    get:
      tags:
      - soporte_sabatico
      description: get SoporteSabatico records by SabaticoId
      operationId: SoporteSabaticoController.GetBySabatico
  /soporte_solicitud/:
    post:
      tags:
      - soporte_solicitud
      description: create SoporteSolicitud con múltiples documentos
      operationId: SoporteSolicitudController.Create
  /soporte_solicitud/{solicitudId}:
    get:
      tags:
      - soporte_solicitud
      description: get SoporteSolicitud records by SolicitudId
      operationId: SoporteSolicitudController.GetBySolicitud
